image: mcr.microsoft.com/playwright:v1.56.1-noble

stages:
  - validate

variables:
  PNPM_STORE_DIR: .pnpm-store

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

before_script:
  - corepack enable
  - pnpm config set store-dir "$PNPM_STORE_DIR"
  - pnpm install --frozen-lockfile

validate:workspace:
  stage: validate
  script:
    - pnpm lint
    - pnpm typecheck
    - pnpm --filter @repo/web test
    - pnpm --filter @repo/web-e2e test:e2e
    - pnpm build
  artifacts:
    when: always
    paths:
      - apps/web-e2e/playwright-report/
      - apps/web-e2e/test-results/
